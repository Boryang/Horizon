name: Bor Daily Radar

on:
  workflow_dispatch:   # 手動觸發；每日排程待使用者同意後再加
    inputs:
      send_email:
        description: "寄出 Email（關閉 = 只跑診斷，不寄信）"
        type: boolean
        default: true
      probe_only:
        description: "只測 Gemini 連線，不跑完整流程"
        type: boolean
        default: false

jobs:
  radar:
    runs-on: ubuntu-latest
    permissions:
      contents: read   # 不寫回 repo、不發布網頁

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.26"

      - name: Install dependencies
        run: uv sync

      - name: Prepare config and recipient (from secrets, never committed)
        env:
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          SEND_EMAIL: ${{ github.event_name != 'workflow_dispatch' || inputs.send_email }}
        run: |
          python - <<'PY'
          import json, os
          cfg = json.load(open("data/config.bor.json"))
          cfg["email"]["enabled"] = os.environ["SEND_EMAIL"] == "true"
          json.dump(cfg, open("data/config.json", "w"), ensure_ascii=False, indent=2)
          json.dump([os.environ["EMAIL_TO"]], open("data/subscribers.json", "w"))
          print("email enabled:", cfg["email"]["enabled"])
          PY

      - name: Probe Gemini API
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.probe_only }}
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          uv run python - <<'PY'
          import json
          from google import genai
          from google.genai import types
          c = genai.Client()
          model = json.load(open("data/config.json"))["ai"]["model"]
          try:
              names = [m.name for m in c.models.list() if "flash" in m.name]
              print(f"::notice title=Gemini flash models::{', '.join(names)[:3000]}")
          except Exception as e:
              print(f"::warning title=Gemini list models failed::{type(e).__name__}: {str(e)[:1500]}")
          import time
          for m in [model, "gemini-3.6-flash", "gemini-3.5-flash", "gemini-3.5-flash-lite", "gemini-flash-latest"]:
              ok, errs = 0, []
              for i in range(6):   # 6 quick calls to surface per-minute limits
                  try:
                      r = c.models.generate_content(model=m, contents='Reply with {"ok": true}',
                          config=types.GenerateContentConfig(max_output_tokens=8192, response_mime_type="application/json"))
                      ok += 1
                      last = f"text={r.text!r} tokens={getattr(r.usage_metadata,'total_token_count',None)}"
                  except Exception as e:
                      errs.append(f"{type(e).__name__}: {str(e)[:300]}")
              print(f"::notice title=Gemini probe {m}::ok={ok}/6 {last if ok else ''} errors={errs[:2]}")
              time.sleep(5)
          PY

      - name: Probe ApeWisdom
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.probe_only }}
        run: |
          python - <<'PY'
          import json, urllib.request
          for f in ["wallstreetbets", "all-stocks"]:
              try:
                  req = urllib.request.Request(f"https://apewisdom.io/api/v1.0/filter/{f}/page/1", headers={"User-Agent": "Mozilla/5.0"})
                  d = json.load(urllib.request.urlopen(req, timeout=30))
                  r = d.get("results", [])[:3]
                  print(f"::notice title=ApeWisdom {f}::keys={list(d.keys())} count={d.get('count')} sample={json.dumps(r)[:1500]}")
              except Exception as e:
                  print(f"::warning title=ApeWisdom {f} failed::{type(e).__name__}: {str(e)[:500]}")
          PY

      - name: Run Horizon
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.probe_only) }}
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: |
          set -o pipefail
          uv run horizon --hours 24 --log-level INFO 2>&1 | tee run.log

      - name: Diagnostics as annotation
        if: ${{ always() && !(github.event_name == 'workflow_dispatch' && inputs.probe_only) }}
        run: |
          python - <<'PY'
          import re, os, glob, collections
          def note(title, text):
              text = text.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
              print(f"::notice title={title}::{text[:3900]}")
          log = open("run.log", encoding="utf-8", errors="replace").read() if os.path.exists("run.log") else ""
          stats = re.findall(r"(Found \d+ items from [^\n]+|Fetched \d+ items[^\n]*|\u5f9e \d+ \u689d[^\n]*|Sending [^\n]*|Sent summary[^\n]*)", log)
          errs = collections.Counter(re.sub(r"0x[0-9a-f]+|\d{6,}", "#", m.strip())[:200] for m in re.findall(r"(?:ERROR|WARNING|CRITICAL)\s+([^\n]+)", log))
          note("1 stats", "\n".join(stats) or "no stats lines")
          note("2 errors", "\n".join(f"{n}x {e}" for e, n in errs.most_common(25)) or "none")
          files = sorted(glob.glob("data/summaries/*.md"))
          if files:
              body = open(files[-1], encoding="utf-8").read()
              for k in range(0, min(len(body), 3900*5), 3900):
                  note(f"3 summary part {k//3900+1}", body[k:k+3900])
          else:
              note("3 summary", "no summary file")
          PY
